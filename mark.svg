<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 520 175" role="img" aria-label="545 Motorsport">
  <defs>
    <linearGradient id="entry" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#ff1fb4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff1fb4"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(28 0) skewX(-8)">
    <!-- faint outside edge of the hairpin -->
    <path d="M212 76 H222 A55 55 0 0 1 222 186 H186" stroke="#ff1fb4" stroke-opacity="0.28" stroke-width="4"/>
    <!-- first 5: navy top bar and stem -->
    <path d="M200 30 H262 M200 30 V92" stroke="#1a0f6b" stroke-width="9"/>
    <!-- the track: straight entry, hairpin, straight exit -->
    <path d="M10 92 H200" stroke="url(#entry)" stroke-width="9"/>
    <path d="M200 92 H222 A39 39 0 0 1 222 170 H178" stroke="#ff1fb4" stroke-width="9"/>
    <!-- 4 -->
    <path d="M352 30 L292 128 H382 M352 30 V170" stroke="#1a0f6b" stroke-width="9"/>
    <!-- last 5 -->
    <path d="M418 30 H480 M418 30 V92 H440 A39 39 0 0 1 440 170 H396" stroke="#1a0f6b" stroke-width="9"/>
  </g>
</svg>
